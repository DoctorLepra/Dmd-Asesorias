name: Keep Supabase Alive (Ping DB)

on:
  schedule:
    # Ejecuta Lunes, Miércoles y Viernes a las 10:00 AM UTC
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          # Usamos un header Cache-Control para obligar a Supabase a procesar la petición y que no se quede en Cloudflare
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Cache-Control: no-cache" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/clientes?select=id&limit=1")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Ping a Supabase exitoso. Código: $HTTP_STATUS"
          else
            echo "❌ Falló el ping a Supabase. Código: $HTTP_STATUS"
            exit 1
          fi

      - name: Evitar que GitHub pause el Cron (Keepalive)
        uses: gautamkrishnar/keepalive-workflow@v2
